<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">opencode-gpt-live</title>
  <desc id="desc">A glowing ring that breathes and shifts from cyan to violet, next to the words: Talk to OpenCode out loud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset="0.55" stop-color="#11101f"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a5cff" stop-opacity="0.28">
        <animate attributeName="stop-color" values="#39c6ff;#9b6bff;#ff5ccd;#39c6ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0b0b14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ae1ff">
        <animate attributeName="stop-color" values="#5ae1ff;#af6eff;#ff55cd;#5ae1ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#2d8cff">
        <animate attributeName="stop-color" values="#2d8cff;#ff55cd;#af6eff;#2d8cff" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="ringB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#af6eff">
        <animate attributeName="stop-color" values="#af6eff;#5ae1ff;#2d8cff;#af6eff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff55cd"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8ecff"/>
      <stop offset="1" stop-color="#c9b8ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style>
      .spin-a { transform-origin: 250px 200px; animation: spin 14s linear infinite; }
      .spin-b { transform-origin: 250px 200px; animation: spin 19s linear infinite reverse; }
      .spin-c { transform-origin: 250px 200px; animation: spin 11s linear infinite; }
      .breathe { transform-origin: 250px 200px; animation: breathe 3.2s ease-in-out infinite; }
      .speak { transform-origin: 250px 200px; animation: speak 1.1s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%, 100% { transform: scale(0.97); } 50% { transform: scale(1.04); } }
      @keyframes speak { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.035); } 60% { transform: scale(0.99); } }
      @media (prefers-reduced-motion: reduce) { .spin-a, .spin-b, .spin-c, .breathe, .speak { animation: none; } }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <circle cx="250" cy="200" r="190" fill="url(#halo)"/>

  <!-- The aura: translucent ribbons woven into a ring. -->
  <g class="breathe">
    <g class="speak" filter="url(#glow)" fill="none" stroke-linecap="round">
      <g class="spin-a">
        <ellipse cx="250" cy="200" rx="112" ry="106" stroke="url(#ringA)" stroke-width="5" opacity="0.95"/>
      </g>
      <g class="spin-b">
        <ellipse cx="250" cy="200" rx="104" ry="114" stroke="url(#ringB)" stroke-width="3.5" opacity="0.75"/>
      </g>
      <g class="spin-c">
        <ellipse cx="250" cy="200" rx="118" ry="101" stroke="url(#ringA)" stroke-width="2.5" opacity="0.6" stroke-dasharray="260 60"/>
      </g>
    </g>
    <circle cx="250" cy="200" r="109" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.55" filter="url(#soft)"/>
  </g>

  <!-- Words. -->
  <text x="470" y="150" font-size="60" font-weight="700" fill="url(#titleFill)" letter-spacing="-1">opencode-gpt-live</text>
  <text x="472" y="204" font-size="30" fill="#b9bfdc">Talk to OpenCode out loud. It talks back,</text>
  <text x="472" y="244" font-size="30" fill="#b9bfdc">and your session does the work.</text>

  <g transform="translate(472 286)">
    <rect width="262" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="20" r="6" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="26" font-size="17" fill="#d7dbef">GPT-Live voice · real time</text>
    <g transform="translate(276 0)">
      <rect width="270" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="20" y="26" font-size="17" fill="#d7dbef">Your ChatGPT subscription</text>
    </g>
    <g transform="translate(560 0)">
      <rect width="236" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="20" y="26" font-size="17" fill="#d7dbef">macOS · Linux · Windows</text>
    </g>
  </g>
</svg>
